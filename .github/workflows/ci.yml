name: GCC floating-point exception probe

on:
  push:
    branches: [ci/portability-gcc]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install FLINT and Boost
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install flint boost
          printf 'FLINT_ROOT=%s\n' "$(brew --prefix flint)" >> "$GITHUB_ENV"
          printf 'CMAKE_PREFIX_PATH=%s\n' "$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Build the original test
        shell: bash
        run: |
          g++-15 --version
          cmake -G 'Unix Makefiles' -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DFLINT_ROOT="$FLINT_ROOT"
          cmake --build build/ci --target test_aberth_step --parallel 4

      - name: Read the two exception masks from the original binary
        shell: bash
        working-directory: build/ci
        run: |
          original=0
          ./test_aberth_step > original.out 2>&1 || original=$?
          cat original.out
          printf 'Original exit status %s\n' "$original"
          cat > fenv_probe.c <<'C'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <fenv.h>
          #include <inttypes.h>
          #include <stdarg.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>

          static int (*read_flags)(int);
          static _Thread_local unsigned previous_flags;
          static _Thread_local unsigned current_flags;
          static _Thread_local void *previous_site;
          static _Thread_local void *current_site;

          __attribute__((constructor)) static void resolve_symbols(void) {
              read_flags = dlsym(RTLD_NEXT, "fetestexcept");
              if (!read_flags) _exit(126);
          }

          int fetestexcept(int mask) {
              const int flags = read_flags(mask);
              previous_flags = current_flags;
              current_flags = (unsigned)flags;
              previous_site = current_site;
              current_site = __builtin_return_address(0);
              return flags;
          }

          static int report(FILE *stream, const char *format, va_list arguments) {
              if (strcmp(format, "FAIL: %s (case %zu)\n") == 0) {
                  Dl_info info;
                  const uintptr_t base = dladdr(current_site, &info) ? (uintptr_t)info.dli_fbase : 0;
                  char line[250];
                  const int size = snprintf(line, sizeof(line),
                      "Observed masks: previous=0x%x current=0x%x FE_OVERFLOW=0x%x FE_INEXACT=0x%x sites=0x%" PRIxPTR ",0x%" PRIxPTR "\n",
                      previous_flags, current_flags, (unsigned)FE_OVERFLOW, (unsigned)FE_INEXACT,
                      (uintptr_t)previous_site - base, (uintptr_t)current_site - base);
                  if (size > 0 && (size_t)size < sizeof(line))
                      (void)write(STDERR_FILENO, line, (size_t)size);
              }
              return vfprintf(stream, format, arguments);
          }

          int fprintf(FILE *stream, const char *format, ...) {
              va_list arguments;
              va_start(arguments, format);
              const int result = report(stream, format, arguments);
              va_end(arguments);
              return result;
          }

          int __fprintf_chk(FILE *stream, int flag, const char *format, ...) {
              (void)flag;
              va_list arguments;
              va_start(arguments, format);
              const int result = report(stream, format, arguments);
              va_end(arguments);
              return result;
          }
          C
          gcc-15 -std=c11 -O2 -shared -fPIC fenv_probe.c -ldl -lm -o fenv_probe.so
          traced=0
          LD_PRELOAD="$PWD/fenv_probe.so" ./test_aberth_step > traced.out 2>&1 || traced=$?
          cat traced.out
          printf 'Traced exit status %s\n' "$traced"
          test "$original" -eq "$traced"
          diff <(sed -n '/^FAIL:/p' original.out) <(sed -n '/^FAIL:/p' traced.out)

      - name: Record instructions near the first exception reads
        shell: bash
        working-directory: build/ci
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          first = re.search(r'sites=(0x[0-9a-f]+),(0x[0-9a-f]+)', Path('traced.out').read_text())
          if first:
              sites = [int(site, 16) for site in first.groups()]
              disassembly = subprocess.check_output(['objdump', '-dC', './test_aberth_step'], text=True)
              for site in sites:
                  print(f'fetestexcept returns to {site:#x}')
                  for line in disassembly.splitlines():
                      address = re.match(r'\s*([0-9a-f]+):', line)
                      if address and site - 360 <= int(address[1], 16) <= site + 20:
                          print(line)
          PY

      - name: Compare compiler options on the same test translation unit
        shell: bash
        working-directory: build/ci
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shlex
          import subprocess

          commands = json.loads(Path('compile_commands.json').read_text())
          entry, = [row for row in commands if row['file'].endswith('/tests/test_aberth_step.cpp')]
          compile_command = shlex.split(entry['command'])
          link_command = ['cmake', '-E', 'cmake_link_script', 'CMakeFiles/test_aberth_step.dir/link.txt', '--verbose=0']
          for option in ('-fno-tree-slp-vectorize', '-frounding-math', '-O2'):
              print(option, flush=True)
              subprocess.run([*compile_command, option], check=True, cwd=entry['directory'])
              subprocess.run(link_command, check=True)
              result = subprocess.run(['./test_aberth_step'], timeout=60)
              if result.returncode not in (0, 1):
                  raise SystemExit(f'Cannot run the test with {option}: {result.returncode}')
              print(option, 'exit status', result.returncode, flush=True)
          PY
