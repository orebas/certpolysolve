name: CI

on:
  push:
    branches: [ci/timeout-fixes-20261120]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event.repository.private == false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 GCC
            runner: ubuntu-26.04
            cc: gcc-15
            cxx: g++-15
            generator: Unix Makefiles
            jobs: 4
          - name: Linux x64 Clang
            runner: ubuntu-26.04
            cc: clang-21
            cxx: clang++-21
            generator: Unix Makefiles
            jobs: 4
          - name: Linux Arm64 GCC
            runner: ubuntu-26.04-arm
            cc: gcc-15
            cxx: g++-15
            generator: Unix Makefiles
            jobs: 4
          - name: macOS Arm64 Apple Clang
            runner: macos-15
            cc: clang
            cxx: clang++
            developer_dir: /Applications/Xcode_26.3.app/Contents/Developer
            generator: Unix Makefiles
            jobs: 3
          - name: Windows x64 MSVC
            runner: windows-2022
            generator: Visual Studio 17 2022
            jobs: 4
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      CMAKE_GENERATOR: ${{ matrix.generator }}
      BUILD_JOBS: ${{ matrix.jobs }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install FLINT and Boost with Homebrew
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install flint boost
          brew list --versions flint boost
          printf 'FLINT_ROOT=%s\n' "$(brew --prefix flint)" >> "$GITHUB_ENV"
          printf 'CMAKE_PREFIX_PATH=%s\n' "$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Configure the vcpkg binary cache
        if: runner.os == 'Windows'
        id: windows-cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-archives'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore Windows dependency binaries
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.runner }}-x64-windows-${{ steps.windows-cache.outputs.image }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-${{ matrix.runner }}-x64-windows-

      - name: Install FLINT and Boost with vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install flint boost-multiprecision --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg list
          $prefix = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows'
          "FLINT_ROOT=$prefix" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          (Join-Path $prefix 'bin') >> $env:GITHUB_PATH

      - name: Save Windows dependency binaries
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure Release
        shell: bash
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DFLINT_ROOT="$FLINT_ROOT"

      - name: Build
        shell: bash
        run: cmake --build build/ci --config Release --parallel "$BUILD_JOBS"

      - name: Run CTest
        shell: bash
        run: ctest --test-dir build/ci -C Release --output-on-failure --parallel "$BUILD_JOBS"
