name: macOS floating-point exception probe

on:
  push:
    branches: [ci/portability-macos]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Arm64 Apple Clang
            runner: macos-15
            cc: clang
            cxx: clang++
            generator: Unix Makefiles
            jobs: 3
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CMAKE_GENERATOR: ${{ matrix.generator }}
      BUILD_JOBS: ${{ matrix.jobs }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install FLINT and Boost with Homebrew
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install flint boost
          brew list --versions flint boost
          printf 'FLINT_ROOT=%s\n' "$(brew --prefix flint)" >> "$GITHUB_ENV"
          printf 'CMAKE_PREFIX_PATH=%s\n' "$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install FLINT and Boost with vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install flint boost-multiprecision --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg list
          $prefix = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows'
          "FLINT_ROOT=$prefix" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          (Join-Path $prefix 'bin') >> $env:GITHUB_PATH

      - name: Configure Release
        shell: bash
        run: |
          xcodebuild -version
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DFLINT_ROOT="$FLINT_ROOT"

      - name: Build
        id: build
        shell: bash
        run: cmake --build build/ci --config Release --parallel "$BUILD_JOBS" -- -k

      - name: Compare the binary64 tests before and after strict exception handling
        shell: bash
        run: |
          tests='^(candidate_interactions|machine_tree|study|model_stopping|d3|refinement_state|budget_stops)$'
          original_status=0
          ctest --test-dir build/ci -C Release --output-on-failure -R "$tests" || original_status=$?
          printf 'Original CTest exit status %s\n' "$original_status"
          cat >> CMakeLists.txt <<'CMAKE'

          set_property(SOURCE
              src/numeric/candidates/machine_candidates.cpp
              src/numeric/candidates/study_candidates.cpp
              src/platform/parallel.cpp
              APPEND PROPERTY COMPILE_OPTIONS -ffp-exception-behavior=strict)
          CMAKE
          cmake -S . -B build/ci
          cmake --build build/ci --config Release --parallel "$BUILD_JOBS"
          ctest --test-dir build/ci -C Release --output-on-failure -R "$tests"
